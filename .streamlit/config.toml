# ==============================================================================
# JASC タスクマネージャー Streamlit 設定（Google アカウント管理風 / フェーズ 7.6-R）
# ==============================================================================

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0B57D0"               # Google Blue 40 (Primary)
backgroundColor = "#F0F4F9"            # Google M3 Light Surface
secondaryBackgroundColor = "#FFFFFF"   # Cards / Containers
textColor = "#1F1F1F"                  # Text Primary
borderColor = "#C4C7C5"                # Outline Variant
baseRadius = "28px"                    # M3 Shape Extra Large (Cards 28px)
buttonRadius = "20px"                  # M3 Expressive Pill Button (40px height)
showWidgetBorder = false
showSidebarBorder = false

# セマンティックカラー
redColor = "#B3261E"                   # M3 Error / 期限切れ NA 専用
orangeColor = "#8B4A00"                # M3 Warning (Due this week)
yellowColor = "#785a00"                # M3 Attention
greenColor = "#146C2E"                 # M3 Success (Completed)
blueColor = "#0B57D0"                  # M3 Primary (In Progress)
violetColor = "#6B4FBB"                # M3 Tertiary (Pending request)
grayColor = "#444746"                  # M3 Neutral Variant (Caption / Secondary)

# タイポグラフィ（Google Sans Flex + Noto Sans JP）
font = "'Google Sans Flex', 'Noto Sans JP', sans-serif:https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
headingFont = "'Google Sans Flex', 'Noto Sans JP', sans-serif:https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..600&family=Noto+Sans+JP:wght@400;500;600&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [400, 400, 500, 500, 500, 500]
metricValueFontSize = "2.25rem"
metricValueFontWeight = 600
paddingTop = "1rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#F0F4F9"
secondaryBackgroundColor = "#F0F4F9"
textColor = "#1F1F1F"
borderColor = "#F0F4F9"
paddingTop = "0.5rem"
paddingBottom = "1.5rem"

[theme.dark]
primaryColor = "#92ccff"               # M3 Primary (Blue 80)
backgroundColor = "#111315"            # M3 Surface (Dark)
secondaryBackgroundColor = "#1e2022"   # Cards (Dark)
textColor = "#e1e2e5"                  # M3 On-Surface (Dark)
borderColor = "#41484d"

redColor = "#ffb4ab"
orangeColor = "#ffb785"
yellowColor = "#f9bd00"
greenColor = "#74db81"
blueColor = "#92ccff"
violetColor = "#cfbcff"
grayColor = "#8e9099"

[theme.dark.sidebar]
backgroundColor = "#111315"
secondaryBackgroundColor = "#111315"
textColor = "#e1e2e5"
borderColor = "#111315"
